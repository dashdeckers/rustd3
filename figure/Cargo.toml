[package]
name = "rustd3-figure"
description = "Figures, layout, typst text and SVG, PNG, PDF and GIF output for rustd3"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation = "https://docs.rs/rustd3-figure"
readme = "README.md"
keywords = ["d3", "plot", "chart", "visualization", "dataviz"]
categories = ["visualization", "graphics", "rendering"]
include = ["src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE-d3"]
autotests = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["fonts"]
fonts = ["dep:rustd3-fonts"]
raster = ["dep:vello_cpu"]
png = ["raster"]
gif = ["raster", "dep:gif"]
pdf = ["dep:krilla"]
tiny-skia = ["dep:tiny-skia"]
helpers = []

[dependencies]
rustd3-core.workspace = true
rustd3-fonts = { workspace = true, optional = true }
typst.workspace = true
typst-layout.workspace = true
ttf-parser.workspace = true
kurbo.workspace = true
peniko.workspace = true
png.workspace = true
thiserror.workspace = true
vello_cpu = { workspace = true, optional = true }
gif = { workspace = true, optional = true }
krilla = { workspace = true, optional = true }
tiny-skia = { workspace = true, optional = true }

[dev-dependencies]
rustd3-testkit.workspace = true
resvg.workspace = true
serde_json.workspace = true

[[test]]
name = "main"
path = "tests/main/main.rs"

[lints]
workspace = true
