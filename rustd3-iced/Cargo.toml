[package]
name = "rustd3-iced"
description = "iced integration for rustd3: IcedPath, pointer input and the Plot widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["fonts"]
fonts = ["dep:rustd3-fonts", "rustd3-figure?/fonts"]
figure = ["dep:rustd3-figure", "rustd3-figure/raster"]

[dependencies]
rustd3-core.workspace = true
thiserror.workspace = true
rustd3-figure = { workspace = true, optional = true }
rustd3-fonts = { workspace = true, optional = true }
iced_core.workspace = true
iced_widget = { workspace = true, features = ["advanced", "canvas", "image"] }

[dev-dependencies]
# The update pattern example's bars blend through `#[derive(Interpolate)]`.
rustd3-core = { workspace = true, features = ["derive"] }
iced = { workspace = true, features = ["advanced", "canvas"] }
iced_test.workspace = true
iced_runtime.workspace = true
rustd3-testkit.workspace = true
png.workspace = true

[[test]]
name = "main"
path = "tests/main/main.rs"

# The README's `Plot` widget.
[[example]]
name = "readme_plot"
required-features = ["figure"]

# The workspace's lints, except that unsafe code is denied, not forbidden:
# the examples set wgpu's API in the environment, which is unsafe, and
# allow that one call. The library forbids unsafe code in `lib.rs`.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "warn"
wildcard_enum_match_arm = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
