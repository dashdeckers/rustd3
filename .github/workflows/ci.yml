name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Tests run in a zone with a 45-minute offset, as scripts/check.sh runs
  # them, so a test that assumes the machine's zone fails everywhere.
  TZ: Asia/Kathmandu

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Every feature: the facade's README examples and the PNG, PDF and
      # GIF code paths.
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The benchmark without its widget, as `cargo rustd3-bench-figure`
      # builds it: no iced, winit or wgpu.
      - run: cargo clippy -p rustd3-bench -p rustd3-examples --all-targets --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      # The wgpu run skips the iced tests when it finds no device instead
      # of failing.
      RUSTD3_ALLOW_NO_GPU: "1"
    steps:
      # Snapshots and the README test compare text: keep LF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # poppler's pdftoppm, pdftotext and pdffonts read the PDF outputs
      # back; lavapipe gives wgpu a Vulkan device on a runner without a GPU.
      - name: Install poppler and lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils mesa-vulkan-drivers
      - name: Install poppler (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install poppler (Windows)
        if: runner.os == 'Windows'
        run: choco install poppler --no-progress -y
      - run: cargo build --workspace
      # iced picks the renderer: wgpu where it finds an adapter, else
      # tiny-skia.
      - run: cargo test --workspace
      # The iced tests again on each backend explicitly; with
      # ICED_TEST_BACKEND set iced does not fall back.
      - name: iced tests on tiny-skia
        run: cargo test -p rustd3-iced -p rustd3-examples -p rustd3-bench --all-features
        env:
          ICED_TEST_BACKEND: tiny-skia
      - name: iced tests on wgpu
        run: cargo test -p rustd3-iced -p rustd3-examples -p rustd3-bench --all-features
        env:
          ICED_TEST_BACKEND: wgpu
      - run: cargo run -p rustd3 --example core_level
      - run: cargo test -p rustd3-bench -p rustd3-examples --no-default-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace's `rust-version`, which every crate inherits.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
      - run: cargo check -p rustd3-bench --all-targets --no-default-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --workspace --no-deps
      - run: cargo doc --workspace --no-deps --all-features
