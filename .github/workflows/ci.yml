name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # .github/ci-run.sh reports a failing command's error lines as
    # annotations; bash is present on every runner.
    shell: bash

env:
  CARGO_INCREMENTAL: 0
  # Tests run in a zone with a 45-minute offset, so a test that assumes
  # the machine's zone fails everywhere.
  TZ: Asia/Kathmandu

jobs:
  fmt:
    name: rustfmt (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: .github/ci-run.sh cargo +nightly fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Every feature: the facade's README examples, the PNG, PDF and GIF
      # code paths and the benchmark's widget profiles.
      - run: .github/ci-run.sh cargo clippy --workspace --all-targets --all-features -- -D warnings
      # No default feature: no fonts, and benchkit without its widget.
      - run: .github/ci-run.sh cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      # The libraries alone with no feature on: benchkit, a dev-dependency
      # of rustd3-figure for its gallery, turns figure's features on for
      # every test and example build, so this is the only build of the
      # featureless crates.
      - run: .github/ci-run.sh cargo clippy --workspace --exclude benchkit --lib --no-default-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is off while the repository is private: GitHub's hosted
        # macOS runners are scarce, and nothing ships from here yet.
        os: [ubuntu-latest, windows-latest] # , macos-latest]
    env:
      # The wgpu run skips the iced tests when it finds no device instead
      # of failing.
      RUSTD3_ALLOW_NO_GPU: "1"
    steps:
      # Snapshots and the README test compare text: keep LF on Windows.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # poppler's pdftoppm, pdftotext and pdffonts read the PDF outputs
      # back; lavapipe gives wgpu a Vulkan device on a runner without a GPU.
      # Two full builds of the workspace (both feature sets) plus the
      # per-backend iced tests exceed the runner's free disk: the linker
      # died with a bus error once the disk was full. The preinstalled
      # .NET, Android and Haskell toolchains free about 30 GB.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install poppler and lavapipe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils mesa-vulkan-drivers
      # The PDF tests fail without poppler rather than skip, so that a
      # machine without it cannot pass them silently: Windows installs it
      # too.
      - name: Install poppler (Windows)
        if: runner.os == 'Windows'
        run: choco install poppler --no-progress -y
      # iced picks the renderer: wgpu where it finds an adapter, else
      # tiny-skia.
      - run: .github/ci-run.sh cargo test --workspace --all-features
      - run: .github/ci-run.sh cargo test --workspace --no-default-features
      # The iced tests again on each backend explicitly; with
      # ICED_TEST_BACKEND set iced does not fall back. Each runs a second
      # time if the first fails: lavapipe, the runners' software Vulkan,
      # now and then segfaults in a test that passes on a rerun.
      - name: iced tests on tiny-skia
        run: |
          .github/ci-run.sh cargo test -p rustd3-iced -p benchkit --all-features \
            || .github/ci-run.sh cargo test -p rustd3-iced -p benchkit --all-features
        env:
          ICED_TEST_BACKEND: tiny-skia
      - name: iced tests on wgpu
        run: |
          .github/ci-run.sh cargo test -p rustd3-iced -p benchkit --all-features \
            || .github/ci-run.sh cargo test -p rustd3-iced -p benchkit --all-features
        env:
          ICED_TEST_BACKEND: wgpu

  examples:
    name: examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .github/ci-run.sh cargo build --workspace --examples --all-features
      - run: .github/ci-run.sh cargo build --workspace --examples --no-default-features
      # The README's examples: core_level asserts what it prints,
      # figure_png writes the README's PNG.
      - run: .github/ci-run.sh cargo run -p rustd3 --example core_level
      - run: .github/ci-run.sh cargo run -p rustd3 --example figure_png --all-features

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The workspace's `rust-version`, which every crate inherits.
      - uses: dtolnay/rust-toolchain@1.97
      - uses: Swatinem/rust-cache@v2
      - run: .github/ci-run.sh cargo check --workspace --all-targets
      - run: .github/ci-run.sh cargo check -p benchkit --all-targets --no-default-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .github/ci-run.sh cargo doc --workspace --no-deps
      - run: .github/ci-run.sh cargo doc --workspace --no-deps --all-features
