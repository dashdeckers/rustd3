name: Performance problem
description: Something is slow on your machine; attach the benchmark's archive.
title: "Performance: "
labels: ["performance"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. From a checkout of rustd3, run `cargo rustd3-bench --quick`
        for the library and the Plot widget (about ten minutes, plus the first
        release build; leave the mouse and keyboard alone while windows open
        and close), or `cargo rustd3-bench-figure --quick` if you use the
        plotting library alone, or on a server or CI without a display (no
        iced build, no window, about a minute). Either prints the path of one
        file last, `bench-results/rustd3-bench-quick-<UTC stamp>.tar.gz` or
        `bench-results/rustd3-bench-figure-quick-<UTC stamp>.tar.gz`. It holds
        the measurements and a description of the machine, and no host name,
        user name or home path (`PRIVACY.md` inside lists what it holds).
        `dev/bench/README.md` describes the levels.
  - type: textarea
    id: slow
    attributes:
      label: What was slow
      description: What you did, with which data (how many points, panels, marks), and what you saw (stutter, lag after a zoom, a blank plot, high CPU).
    validations:
      required: true
  - type: dropdown
    id: command
    attributes:
      label: The command you ran
      options:
        - cargo rustd3-bench (the library and the Plot widget)
        - cargo rustd3-bench --figure-only (the library alone)
        - cargo rustd3-bench-figure (the library alone, built without iced)
        - none (I could not run it; say why below)
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: The level you ran
      options:
        - --quick
        - --default
        - --full
        - none (I could not run it; say why below)
    validations:
      required: true
  - type: textarea
    id: archive
    attributes:
      label: The archive
      description: Drag `rustd3-bench-<level>-<UTC stamp>.tar.gz` (or `rustd3-bench-figure-<level>-…`) here; paste the console's last lines if it did not finish.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Pop!_OS 24.04, Windows 11 23H2, macOS 15.1
    validations:
      required: true
  - type: input
    id: desktop
    attributes:
      label: Desktop
      description: The desktop and its session, if you know them.
      placeholder: e.g. COSMIC on Wayland, GNOME on X11, Windows, macOS
  - type: input
    id: display
    attributes:
      label: Display
      description: Resolution, refresh rate and scale factor of the display the plot was on; GPU if you know it.
      placeholder: e.g. 2560 x 1440 at 144 Hz, 125 %, RTX 3060
