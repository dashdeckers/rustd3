[package]
name = "rustd3-bench"
description = "The full-frame benchmark of rustd3's Plot widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["widget"]
# The Plot widget's benchmark: iced, rustd3-iced and the window code.
# Without it, `cargo rustd3-bench-figure` builds the plotting library's
# figure profile alone (D22.10).
widget = ["dep:rustd3-iced", "dep:iced", "dep:iced_runtime", "rustd3-examples/widget"]

[dependencies]
rustd3-core.workspace = true
rustd3-figure = { workspace = true, features = ["fonts", "png", "pdf", "gif"] }
rustd3-examples = { path = "../examples", default-features = false }
rustd3-iced = { workspace = true, features = ["figure"], optional = true }
iced = { workspace = true, features = ["advanced", "canvas"], optional = true }
iced_runtime = { workspace = true, optional = true }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The submission archive's gzip (D22.9); 1.1.10 is already in the lock tree.
flate2 = "1.1.10"

[dev-dependencies]
rustd3-testkit.workspace = true

[lints]
workspace = true
