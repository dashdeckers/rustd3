[package]
name = "rustd3-bench"
description = "The full-frame benchmark of rustd3's Plot widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
rustd3-core.workspace = true
rustd3-figure = { workspace = true, features = ["fonts", "png"] }
rustd3-examples = { path = "../examples" }
rustd3-iced = { workspace = true, features = ["figure"] }
iced = { workspace = true, features = ["advanced", "canvas"] }
iced_runtime.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The submission archive's gzip (D22.9); 1.1.10 is already in the lock tree.
flate2 = "1.1.10"

[dev-dependencies]
rustd3-testkit.workspace = true

[lints]
workspace = true
