[package]
name = "rustd3-examples"
description = "rustd3's examples: trace, scatter, the wheel figure, focus and context, the update pattern and presets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["widget"]
# The iced examples (focus_context, update_pattern, the README's iced
# code); without it the figures alone build.
widget = ["dep:rustd3-iced", "dep:iced"]

[dependencies]
rustd3-core = { workspace = true, features = ["derive"] }
rustd3-figure = { workspace = true, features = ["fonts", "png", "pdf", "gif", "helpers"] }
rustd3-iced = { workspace = true, features = ["figure"], optional = true }
iced = { workspace = true, features = ["advanced", "canvas"], optional = true }

[dev-dependencies]
rustd3-testkit.workspace = true
iced_test.workspace = true
png.workspace = true

[[test]]
name = "main"
path = "tests/main/main.rs"

[[example]]
name = "focus_context"
required-features = ["widget"]

[[example]]
name = "readme_canvas"
required-features = ["widget"]

[[example]]
name = "readme_plot"
required-features = ["widget"]

[[example]]
name = "update_pattern"
required-features = ["widget"]

[lints]
workspace = true
