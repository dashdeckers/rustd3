[package]
name = "rustd3-examples"
description = "rustd3's examples: trace, scatter, the wheel figure, the use cases and presets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
rustd3-core = { workspace = true, features = ["derive"] }
rustd3-figure = { workspace = true, features = ["fonts", "png", "pdf", "gif", "helpers"] }
rustd3-iced = { workspace = true, features = ["figure"] }
iced = { workspace = true, features = ["advanced", "canvas"] }

[dev-dependencies]
rustd3-testkit.workspace = true
iced_test.workspace = true
png.workspace = true

[[test]]
name = "main"
path = "tests/main/main.rs"

[lints]
workspace = true
