[package]
name = "rustd3-examples"
description = "rustd3's examples: trace, scatter, the wheel figure, the use cases and presets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[dependencies]
rustd3-core = { workspace = true, features = ["derive"] }
rustd3-figure = { workspace = true, features = ["fonts", "png", "pdf", "gif", "helpers"] }

[dev-dependencies]
rustd3-testkit.workspace = true
