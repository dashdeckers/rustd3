[workspace]
resolver = "3"
members = ["rustd3", "rustd3-core", "rustd3-derive", "rustd3-figure", "rustd3-fonts",
           "rustd3-iced", "rustd3-testkit", "benchkit"]
# Every member, so that `cargo run --example <name>` finds any crate's
# example from the root (example names are unique across the workspace).
default-members = ["rustd3", "rustd3-core", "rustd3-derive", "rustd3-figure",
                   "rustd3-fonts", "rustd3-iced", "rustd3-testkit", "benchkit"]
exclude = [".claude"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
rustd3-core = { path = "rustd3-core", version = "0.1.0" }
rustd3-derive = { path = "rustd3-derive", version = "0.1.0" }
rustd3-figure = { path = "rustd3-figure", version = "0.1.0", default-features = false }
rustd3-fonts = { path = "rustd3-fonts", version = "0.1.0" }
rustd3-iced = { path = "rustd3-iced" }
rustd3-testkit = { path = "rustd3-testkit" }
benchkit = { path = "benchkit", default-features = false }
jiff = "0.2.38"
thiserror = "2"
syn = "2"
quote = "1"
proc-macro2 = "1"
typst = "0.15.1"
typst-layout = "0.15.1"
ttf-parser = "0.25"
kurbo = "0.13.1"
peniko = "0.6.1"
png = "0.18"
vello_cpu = { version = "0.4.0", default-features = false, features = ["std", "text", "u8_pipeline", "multithreading"] }
gif = "0.14"
krilla = "0.8.2"
tiny-skia = "0.12"
serde_json = "1"
resvg = "0.48.1"
iced_core = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced_widget = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced_test = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "98bd48fe011efc0ec5819fee0fa7673a7169ff11" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
allow_attributes_without_reason = "warn"
mod_module_files = "warn"
wildcard_enum_match_arm = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.package."vello_cpu@0.4.0"]
opt-level = 3

[profile.dev.package."vello_common@0.4.0"]
opt-level = 3

[profile.dev.package."fearless_simd@1.2.0"]
opt-level = 3

[profile.dev.package."tiny-skia@0.12.0"]
opt-level = 3
