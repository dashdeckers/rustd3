[package]
name = "rustd3-iced"
description = "iced integration for rustd3: IcedPath, pointer input and the Plot widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["fonts"]
fonts = ["rustd3-figure?/fonts"]
figure = ["dep:rustd3-figure", "rustd3-figure/raster"]

[dependencies]
rustd3-core.workspace = true
thiserror.workspace = true
rustd3-figure = { workspace = true, optional = true }
iced_core.workspace = true
iced_widget = { workspace = true, features = ["advanced", "canvas", "image"] }

[dev-dependencies]
iced = { workspace = true, features = ["advanced", "canvas"] }
iced_test.workspace = true
iced_runtime.workspace = true
rustd3-testkit.workspace = true
png.workspace = true
benchkit = { workspace = true, features = ["widget"] }

[[test]]
name = "main"
path = "tests/main/main.rs"

# The benchmark (benchkit's README): the level, its windowed and offscreen
# widget profiles, and the archives' readers.
[[example]]
name = "bench_all"
required-features = ["figure"]

[[example]]
name = "bench_gestures"
required-features = ["figure"]

[[example]]
name = "bench_software"
required-features = ["figure"]

[[example]]
name = "bench_compare"

[[example]]
name = "bench_report"

[lints]
workspace = true
