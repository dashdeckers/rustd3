[package]
name = "rustd3-iced"
description = "iced integration for rustd3: IcedPath, pointer input and the Plot widget"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
autotests = false

[features]
default = ["fonts"]
fonts = ["rustd3-figure?/fonts"]
figure = ["dep:rustd3-figure", "rustd3-figure/raster"]
# Not for apps: makes `plot::cost`, the cost model's seed constants,
# public (hidden from the docs) for the benchmark and the tests.
__dev = ["figure"]

[dependencies]
rustd3-core.workspace = true
thiserror.workspace = true
rustd3-figure = { workspace = true, optional = true }
iced_core.workspace = true
iced_widget = { workspace = true, features = ["advanced", "canvas", "image"] }

[dev-dependencies]
iced = { workspace = true, features = ["advanced", "canvas"] }
iced_test.workspace = true
iced_runtime.workspace = true
rustd3-testkit.workspace = true
png.workspace = true

[[test]]
name = "main"
path = "tests/main/main.rs"

[lints]
workspace = true
