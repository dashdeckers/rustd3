[package]
name = "rustd3-core"
description = "d3's scales, ticks, shapes, formats, time, color and interaction as plain Rust values"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
documentation = "https://docs.rs/rustd3-core"
readme = "README.md"
keywords = ["d3", "scale", "chart", "visualization", "time"]
categories = ["visualization", "science", "date-and-time"]
include = ["src/**/*.rs", "/Cargo.toml", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/LICENSE-d3"]
autotests = false

[package.metadata.docs.rs]
all-features = true

[[test]]
name = "main"
path = "tests/main/main.rs"

[features]
derive = ["dep:rustd3-derive"]

[dependencies]
jiff.workspace = true
thiserror.workspace = true
web-time = "1.1.0"
rustd3-derive = { workspace = true, optional = true }

[dev-dependencies]
rustd3-testkit.workspace = true
serde_json.workspace = true

[lints]
workspace = true
